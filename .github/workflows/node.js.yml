# spellchecker:ignore: aquasecurity, coverallsapp, htmlproofer, junitresults, misconfig, nvmrc, softprops, vuln

name: "Node.js CI"
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required to create the GitHub release for version tags
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Otherwise the commitlint checks would fail for `--from initial` since by default only the last commit is fetched
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - name: Check for Git conflict markers
        run: git diff --check
      - name: Install NPM packages
        run: npm ci
      - name: Audit NPM package signatures # protects against attacks via a registry mirror or proxy (https://docs.npmjs.com/about-registry-signatures)
        run: npm audit signatures
      - name: Check commit messages (commitlint)
        run: npx commitlint --from initial_algebra.ts --to HEAD # don't check commits from before the fork
      - name: Check spelling (CSpell)
        run: npx cspell --dot .
      - name: Check formatting (Prettier)
        run: npx prettier --check .
      - name: Lint Markdown (markdownlint)
        run: npx markdownlint-cli2 '**/*.md' '#node_modules'
      - name: Lint JavaScript (ESLint)
        run: npx eslint --max-warnings=0 .
      - name: Test (Jest)
        run: npm run test:ci
      - name: Coverage (Jest to Coveralls)
        uses: coverallsapp/github-action@v2.3.8
        with:
          file: coverage/lcov.info
      - name: Build
        run: npm run build
      - name: Extract the changelog entry of this release
        if: ${{ github.ref_type == 'tag' }}
        id: release-notes
        # `conventional-changelog` appends, so the entry of this release is the
        # last section of the changelog. It is empty for a release which only
        # contains commit types the changelog hides, such as `docs` or `ci`.
        run: |
          {
            echo "notes<<END_OF_RELEASE_NOTES"
            awk '/^## \[/ { capture = 1; notes = ""; next } capture { notes = notes $0 "\n" } END { printf "%s", notes }' CHANGELOG.md
            echo "END_OF_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"
      - name: Create the GitHub release for Git tags
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v3.0.3
        with:
          body: ${{ steps.release-notes.outputs.notes }}
          # fall back to the commit list so that a release whose changelog
          # entry is empty does not end up without any notes at all
          generate_release_notes: ${{ steps.release-notes.outputs.notes == '' }}
          files: dist/algebra.*.js
          fail_on_unmatched_files: true
      - name: Publish to NPM
        if: ${{ github.ref_type == 'tag' }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Test summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: .jest-results/junit.xml
  check_documentation:
    name: check documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          working-directory: docs
      - name: Generate documentation
        run: bundle exec jekyll build --strict_front_matter --destination ./_site/algebra.ts --baseurl /algebra.ts # use `destination` to simulate non-root hosting for `htmlproofer`
      - name: Check documentation (html-proofer)
        run: bundle exec htmlproofer --typhoeus='{"headers":{"User-Agent":"Mozilla/5.0 (compatible; GitHub build HTML checker)"}}' ./_site # Some sites block the default `html-proofer` user agent. Since the builds and their resulting checks are infrequent, this workaround should be acceptable.
  security_scan:
    name: security scan
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install project production dependencies
        run: npm install --omit=dev --ignore-scripts # `--ignore-scripts` is needed because normally the dev dependencies are installed including Husky but they are omitted for the security scan and `scripts.prepare` in `package.json` runs `husky install`.
      - name: Run security scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: table
          exit-code: 1
